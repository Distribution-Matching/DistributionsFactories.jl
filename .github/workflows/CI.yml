name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        version:
          - '1.9'
          - '1'
        os:
          - ubuntu-latest
          - macos-latest
        # Julia 1.9 binaries need an executable stack, which the current
        # ubuntu-latest image refuses; test 1.9 on Linux on 22.04 instead.
        exclude:
          - version: '1.9'
            os: ubuntu-latest
        include:
          - version: '1.9'
            os: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v2
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
